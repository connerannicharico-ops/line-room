name: Update projections
 
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC): fresh lines, injuries, depth charts, and stats
  workflow_dispatch: {}      # lets you run it any time from the Actions tab
 
permissions:
  contents: write
 
concurrency:
  group: update
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Pull latest odds (skipped if no ODDS_API_KEY secret)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds.py
      - name: Rebuild projection data
        run: python scripts/prep.py --download --out docs/data.json
      - name: Commit if changed
        run: |
          git config user.name "line-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update projection data" && git push; fi
 
